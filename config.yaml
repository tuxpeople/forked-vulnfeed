site:
  url: https://tuxpeople.github.io/forked-vulnfeed
  github: https://github.com/tuxpeople/forked-vulnfeed

feed:
  # Most recent advisories to publish. Subscribers re-download the whole
  # feed on every poll, so this bounds it.
  max_items: 100
  # Optional: also drop anything published longer ago than this.
  # max_age_days: 365

feeds:
  - source: github
    repos:
      - rancher/rancher
      - rancher/rke2
      - rancher/fleet
      - longhorn/longhorn
      - longhorn/longhorn-manager
      - longhorn/longhorn-engine
      - longhorn/longhorn-instance-manager
      - containerd/containerd
      - opencontainers/runc
      - cilium/cilium

  # Advisories filed against these projects' published packages, which the
  # repository endpoint above does not return. Package names could not be
  # confirmed against the live API when this was added — the run logs
  # "No advisories found for <package>; check the package name" for any that
  # are wrong, so check the first run's output and correct or remove them.
  - source: ghsa
    packages:
      - ecosystem: go
        name: github.com/rancher/rancher
      - ecosystem: go
        name: github.com/k3s-io/k3s
      - ecosystem: go
        name: github.com/rancher/fleet
      - ecosystem: go
        name: github.com/rancher/local-path-provisioner
      - ecosystem: go
        name: github.com/containerd/containerd
      - ecosystem: go
        name: github.com/containerd/containerd/v2
      - ecosystem: go
        name: github.com/opencontainers/runc
      - ecosystem: go
        name: github.com/coredns/coredns
      - ecosystem: go
        name: helm.sh/helm/v3
      - ecosystem: go
        name: github.com/cert-manager/cert-manager
      - ecosystem: go
        name: github.com/neuvector/neuvector
      - ecosystem: go
        name: github.com/goharbor/harbor
      - ecosystem: go
        name: github.com/cilium/cilium
